stages:
  preprocess:
    cmd: python -m src.data_preprocessing
    deps:
      - src/data_preprocessing.py
      - data/raw
    outs:
      - data/processed

  train:
    cmd: python -m src.train --epochs 5 --batch_size 16 --lr 1e-3
    deps:
      - src/train.py
      - src/model.py
      - data/processed
    outs:
      - models/model.pt
    metrics:
      - models/metrics.json:
          cache: false
    plots:
      - models/loss_curve.png:
          cache: false
      - models/confusion_matrix.png:
          cache: false

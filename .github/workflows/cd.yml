name: CD - Deploy & Smoke Test

# Runs after CI succeeds on main, i.e. continuous deployment on every merge.
on:
  workflow_run:
    workflows: ["CI - Test, Build & Publish"]
    types: [completed]
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/catsdogs-inference

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: catsdogs-cluster

      - name: Log in to GHCR (to allow the cluster to pull the image)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull the newly built image
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}"
          docker pull "$IMAGE_TAG"
          kind load docker-image "$IMAGE_TAG" --name catsdogs-cluster

      - name: Render & apply K8s manifests (deploy/update on main)
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}"
          sed "s#ghcr.io/OWNER/REPO/catsdogs-inference:<TAG>#$IMAGE_TAG#" k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/catsdogs-inference --timeout=120s

      - name: Port-forward the service for smoke testing
        run: |
          kubectl port-forward svc/catsdogs-inference-svc 8000:8000 &
          sleep 5

      - name: Run post-deploy smoke tests (health + prediction)
        run: bash scripts/smoke_test.sh http://localhost:8000 tests/fixtures/sample_cat.jpg

      - name: Roll back on failure
        if: failure()
        run: |
          echo "Smoke tests failed -- rolling back to previous revision"
          kubectl rollout undo deployment/catsdogs-inference
          exit 1
